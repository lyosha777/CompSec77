<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Password Recovery</h1>
    </header>
    <main>
        <form id="recoveryForm" onsubmit="recoverPassword(event)">
            <div>
                <label for="recoveryUsername">Username:</label>
                <input type="text" id="recoveryUsername" name="username" required>
            </div>
            <div>
                <label for="recoveryCode">Recovery Code:</label>
                <input type="text" id="recoveryCode" name="recoveryCode" required>
            </div>
            <div>
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" name="newPassword" required>
            </div>
            <div>
                <label for="confirmNewPassword">Confirm New Password:</label>
                <input type="password" id="confirmNewPassword" name="confirmNewPassword" required>
            </div>
            <button type="submit">Reset Password</button>
        </form>
        <p>Remember your password? <a href="login.html">Login here</a></p>
    </main>
    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </footer>
    <script src="auth.js"></script>
</body>
</html>
