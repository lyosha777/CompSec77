<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embassy Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <select id="language-select">
                <option value="en">English</option>
                <!-- Add more language options as needed -->
            </select>
        </nav>
    </header>

    <main>
        <section id="home">
            <!-- Add content for the home section -->
        </section>

                <!-- Signup Form -->
                <form id="signupForm" onsubmit="signup(event)" style="display: none;">
                    <h2>Sign Up</h2>
                    <div>
                        <label for="signupUsername">Username:</label>
                        <input type="text" id="signupUsername" name="username" required>
                    </div>
                    <div>
                        <label for="signupPassword">Password:</label>
                        <input type="password" id="signupPassword" name="password" required>
                    </div>
                    <div>
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                    <button type="submit">Sign Up</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <!-- Add your footer content here -->
    </footer>

    <script src="auth.js"></script>
    <script>
        // Check if the user is authenticated
        function checkAuthentication() {
            // Implement your authentication check logic here
            // For example, you can check if a token exists in local storage
            const isAuthenticated = localStorage.getItem('token') !== null;

            if (!isAuthenticated) {
                // Redirect to the login page if the user is not authenticated
                window.location.href = 'login.html';
            }
        }

        // Call the checkAuthentication function when the page loads
        window.onload = checkAuthentication;
    </script>
</body>
</html>
