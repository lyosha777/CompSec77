<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embassy Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <select id="language-select">
                <option value="en">English</option>
                <!-- Add more language options as needed -->
            </select>
        </nav>
    </header>

    <main>
        <section id="home">
            <!-- Add content for the home section -->
        </section>

        <section id="services">
            <!-- Add content for the services section -->
        </section>

        <section id="about">
            <!-- Add content for the about section -->
        </section>

        <section id="contact">
            <!-- Add content for the contact section -->
        </section>
    </main>

    <footer>
        <!-- Add your footer content here -->
    </footer>

    <script src="auth.js"></script>
    <script>
        // Check if the user is authenticated
        function checkAuthentication() {
            // Implement your authentication check logic here
            // For example, you can check if a token exists in local storage
            const isAuthenticated = localStorage.getItem('token') !== null;

            if (!isAuthenticated) {
                // Redirect to the login page if the user is not authenticated
                window.location.href = 'login.html';
            }
        }

        // Call the checkAuthentication function when the page loads
        window.onload = checkAuthentication;
    </script>
</body>
</html>
